[package]
name = "ave-core"
version = "0.12.0"
edition.workspace = true
authors.workspace = true
description = "Averiun Ledger core runtime and node API"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = { workspace = true }
borsh = { workspace = true }
ave-common = { workspace = true, features = ["sink-grpc", "compiler-grpc"] }
ave-contract-sdk = { path = "../../ave-contract-sdk", version = "0.8.0", default-features = false, features = ["runtime"] }
json-patch = "4.2.0"
ave-actors = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["std", "formatting", "parsing"] }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "fs", "process"] }
tracing = { workspace = true }
ave-network = { workspace = true }
rmp-serde = { workspace = true }
base64 = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
rustls = "0.23"
rustls-native-certs = "0.8"
percent-encoding = "2"
rand = { workspace = true }
fastrand = { workspace = true }
bytes = { workspace = true }
lru = { workspace = true }
prometheus-client = { workspace = true }
futures = { workspace = true }
rdkafka = { workspace = true }
httpdate = "1"
flate2 = "1"
zstd = "0.13"
tonic = { workspace = true }
tonic-health = { workspace = true }
tonic-types = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
subtle = { workspace = true, optional = true }
config = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
test-log = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-stream = "0.1"
ave-network = { workspace = true, features = ["test"] }
serial_test = { workspace = true }
futures = { workspace = true }
axum = { workspace = true }
tracing-test = { version = "0.2", features = ["no-env-filter"] }
testcontainers = { workspace = true }
axum-server = { workspace = true }
rcgen = "0.14"
tokio-rustls = "0.26"
aws-lc-rs = { version = "1", features = ["ring-io"] }

[features]
default = ["sqlite", "ext-sqlite", "prometheus"]
rocksdb = ["ave-actors/rocksdb"]
sqlite = ["ave-actors/sqlite"]
ext-sqlite = ["ave-actors/export-sqlite"]
prometheus = ["ave-actors/prometheus"]
# gRPC compiler service (the standalone `ave-compiler` binary and the
# embedded test compiler): not part of the node image.
compiler-service = [
    "dep:subtle",
    "dep:config",
    "dep:tracing-subscriber",
    "tokio-stream/net",
    "tokio/signal",
    "tokio/rt-multi-thread",
]
test = ["compiler-service"]

[[bin]]
name = "ave-compiler"
path = "src/bin/ave-compiler.rs"
required-features = ["compiler-service"]
