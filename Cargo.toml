[package]
name = "ave"
version = "0.12.0"
edition.workspace = true
authors.workspace = true
description = "Aggregated Ave crate re-exporting the main public workspace crates"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
rust-version.workspace = true

[workspace]
members = [
    "identity",
    "core",
    "bridge",
    "network",
    "http",
    "common"
]
default-members = [
    ".",
    "identity",
    "core",
    "bridge",
    "network",
    "http",
    "common"
]

resolver = "2"

[workspace.package]
version = "0.12.0"
edition = "2024"
authors = ["Averiun Ledger, SL <info@averiun.com>"]
description = "Averiun Ledger library"
readme = "README.md"
homepage = "https://averiun.com"
repository = "https://github.com/Averiun-Ledger/ave"
license = "AGPL-3.0-only"
keywords = ["traceability", "distributed-ledger", "Averiun", "sustainability"]
rust-version = "1.95.0"

[workspace.dependencies]
ave-core = { path = "core", version = "0.12.0", default-features = false }
ave-bridge = { path = "bridge", version = "0.12.0", default-features = false }
ave-network = { path = "network", version = "0.10.0" }
ave-identity = { path = "identity", version = "0.3.0" }
ave-common = { path = "common", version = "0.10.0" }
pkcs8 = "0.11.0"
axum = "0.8.9"
utoipa = "5.5.0"
async-trait = "0.1.91"
bs58 = "0.5.1"
base64 = "0.23.0"
blake3 = "1.8.5"
borsh = { version = "1.8.0", features = ["std", "derive"] }
ed25519-dalek = { version = "3", features = ["alloc", "pkcs8"] }
futures = "0.3.33"
futures-timer = "3.0"
prometheus-client = "0.25.0"
getrandom = "0.4.3"
ip_network = "0.4"
bytes = { version = "1.12.1", features = ["serde"] }
libp2p = { version = "0.56.0", default-features = false }
libp2p-swarm-test = "0.6.0"
memsecurity = { version = "3.5.2", features = ["encryption"] }
metrics = "0.24.6"
rand = "0.10.2"
fastrand = "2"
rmp-serde = "1.3"
serial_test = "4.0.1"
sha2 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
time = "0.3.54"
thiserror = "2.0.19"
tokio = "1.53.1"
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
file-rotate = "0.8"
test-log = { version = "0.2.21", features = ["trace"] }
ave-actors = { path = "../ave-actors", version = "0.13.0", default-features = false }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
config = { version = "0.15.25", features = ["json", "toml", "yaml"] }
zeroize = "1.9"
subtle = "2.6"
lru = "0.18.1"
rdkafka = { version = "0.39.0", features = ["tokio", "ssl", "zstd"] }
testcontainers = { version = "0.27.3", default-features = false, features = ["blocking"] }
tonic = { version = "0.13", default-features = false, features = ["transport", "channel", "router", "prost", "codegen", "tls-aws-lc", "tls-native-roots", "gzip"] }
tonic-health = "0.13"
tonic-types = "0.13"
prost = "0.13"
tonic-build = "0.13"
protoc-bin-vendored = "3"

[dependencies]
ave-identity = { path = "identity", version = "0.3.0" }
ave-network = { path = "network", version = "0.10.0" }
ave-common = { path = "common", version = "0.10.0" }
ave-core = { path = "core", version = "0.12.0", default-features = false }
ave-bridge = { path = "bridge", version = "0.12.0", default-features = false }
ave-http = { path = "http", version = "0.12.0", default-features = false, optional = true }

[features]
default = ["sqlite", "ext-sqlite", "prometheus"]
sqlite = ["ave-core/sqlite", "ave-bridge/sqlite"]
rocksdb = ["ave-core/rocksdb", "ave-bridge/rocksdb"]
ext-sqlite = ["ave-core/ext-sqlite", "ave-bridge/ext-sqlite"]
prometheus = ["ave-bridge/prometheus", "ave-core/prometheus"]
openapi = ["ave-bridge/openapi"]
http = ["dep:ave-http"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.experimental]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "debuginfo"
