[package]
name = "ave-http"
version = "0.13.0"
edition.workspace = true
authors.workspace = true
description = "HTTP API server for the Ave runtime, auth system, and admin surface"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
rust-version.workspace = true

[dependencies]
ave-bridge = { workspace = true, features = ["openapi"] }
ave-core = { workspace = true, default-features = false }
prometheus-client = { workspace = true, optional = true }

tokio = { workspace = true }

serde_json = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
file-rotate = { workspace = true }

futures = { workspace = true }

reqwest = { workspace = true }
axum-server = { workspace = true }
axum = { workspace = true }
ip_network = { workspace = true }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "cors", "set-header"] }
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }
tokio-util = { workspace = true }

# Auth system dependencies
ave-actors = { workspace = true, default-features = false, features = ["export-sqlite"] }
argon2 = { version = "0.6.0" }
sha2 = { workspace = true }
hex = "0.4.3"
rand = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }

# Self-signed certificate generation
rcgen = "0.14"
x509-parser = "0.18"

[dev-dependencies]
# Self dev-dependency: enables the `test` feature whenever test targets
# are built, so plain `cargo test` keeps custom config paths without
# needing `--features test` (same pattern as ave-core).
ave-http = { path = ".", features = ["test"] }
test-log = { workspace = true }
tempfile = { workspace = true }
chrono = "0.4.45"
ave-bridge = { workspace = true, features = ["openapi", "test"] }

[features]
default = ["sqlite", "ext-sqlite", "prometheus"]
rocksdb = ["ave-bridge/rocksdb"]
sqlite = ["ave-bridge/sqlite"]
ext-sqlite = ["ave-bridge/ext-sqlite"]
prometheus = ["ave-bridge/prometheus", "ave-core/prometheus", "dep:prometheus-client"]
test = ["ave-bridge/test"]
# In-process contract toolchain (cargo + rustc): only images built
# with this feature can take the compiler role (light images omit it).
toolchain = ["ave-core/toolchain"]
